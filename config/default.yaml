# VaultMind default configuration.
# Copy to config/local.yaml (gitignored) to override, or point VAULTMIND_CONFIG at another file.
# Every retrieval/agent switch here is also an eval ablation knob.

paths:
  vault_dir: ./vault        # watched folder for your documents
  data_dir: ./data          # LanceDB index + SQLite app state

ollama:
  host: http://127.0.0.1:11434
  keep_alive: 30m           # keep models loaded between questions

models:
  llm: qwen3:14b
  embedder: qwen3-embedding:0.6b
  reranker: BAAI/bge-reranker-v2-m3
  num_ctx: 16384            # Ollama's default is small and silently truncates context
  think: false              # let the LLM reason before free-form answers (slower); never for JSON calls

chunking:
  child_tokens: 256         # small chunks are what we search over
  parent_tokens: 1200       # larger enclosing section is what the LLM reads
  overlap: 0.15

retrieval:
  hybrid: true              # vector + BM25 fused with RRF
  candidates: 20            # retrieved before reranking
  top_k: 5                  # passed to the generator
  rerank: true
  rerank_threshold: 0.3     # reranker score below this = chunk fails grading
  small_to_big: false       # true: send each hit's parent section to the LLM, not the child chunk

agent:
  loop: true                  # corrective graph (analyze -> retrieve -> grade -> rewrite/generate); false = linear
  query_variants: 0           # extra phrasings searched alongside the question (2: +recall, +1.2 s)
  rewrite: false              # when nothing passes grading, rewrite the query and search again
  max_rewrites: 2
  injection_guard: true       # passages go in delimited data blocks; instruction-like text is flagged
  detect_contradictions: true   # one LLM call when sources span 2+ files: report conflicts, cite both
  groundedness_check: false     # one LLM call: flag answer claims their cited passage doesn't support
  smalltalk: true               # nothing passed grading and analyze didn't run (a chat's first
                                # message): one short reply, so "hi" gets a greeting; factual
                                # questions still get not-found with the closest matches
  router: true                  # one planning call classifies every message (lookup, summarize,
                                # compare, list...) and picks its path; false: everything is a lookup
  world_knowledge: false        # true: when your documents don't cover it, a clearly labeled
                                # answer from the local model's own knowledge (still offline)
  catalog_files: 60             # the planner sees every document's name and one line up to this
                                # many files; above it, it searches the document cards
  max_steps: 6                  # tool calls an open, multi-step task may make
  observation_tokens: 2000      # longest tool result shown to the model, in tokens
  think_open: true              # let the model reason before open-task tool calls (slower)

ingest:
  watch: true               # index changes in paths.vault_dir while the app runs
  debounce_s: 2.0           # wait for a file to stop changing before indexing it
  enrich: true              # after indexing, write a document card (type, summary, outline,
                            # dates, section summaries) in the background: ~10-60 s of GPU
                            # per document, once per file content

ui:
  native: false             # false: a tab in your browser; true: own window (on Windows its
                            # WebView2 engine contacts Microsoft by itself, see docs/STATUS.md)
  port: 8730                # the UI is served on 127.0.0.1 only, never on the network
  privacy_check_s: 5        # how often the privacy badge checks the app's connections
