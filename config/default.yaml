# VaultMind default configuration.
# Copy to config/local.yaml (gitignored) to override, or point VAULTMIND_CONFIG at another file.
# Every retrieval/agent switch here is also an eval ablation knob.

paths:
  vault_dir: ./vault        # watched folder for your documents
  data_dir: ./data          # LanceDB index + SQLite app state

ollama:
  host: http://127.0.0.1:11434
  keep_alive: 30m           # keep models loaded between questions

models:
  llm: qwen3:14b
  embedder: qwen3-embedding:0.6b
  reranker: BAAI/bge-reranker-v2-m3
  num_ctx: 16384            # Ollama's default is small and silently truncates context
  think: false              # let the LLM reason before free-form answers (slower); never for JSON calls

chunking:
  child_tokens: 256         # small chunks are what we search over
  parent_tokens: 1200       # larger enclosing section is what the LLM reads
  overlap: 0.15

retrieval:
  hybrid: true              # vector + BM25 fused with RRF
  candidates: 20            # retrieved before reranking
  top_k: 5                  # passed to the generator
  rerank: true
  rerank_threshold: 0.3     # reranker score below this = chunk fails grading
  small_to_big: false       # true: send each hit's parent section to the LLM, not the child chunk

agent:
  loop: true                  # corrective graph (analyze -> retrieve -> grade -> rewrite/generate); false = linear
  query_variants: 2           # extra phrasings of the question searched alongside it
  rewrite: true               # when nothing passes grading, rewrite the query and search again
  max_rewrites: 2
  injection_guard: true       # passages go in delimited data blocks; instruction-like text is flagged
  detect_contradictions: false  # one LLM call: report conflicting claims across files, cite both
  groundedness_check: false     # one LLM call: flag answer claims their cited passage doesn't support
