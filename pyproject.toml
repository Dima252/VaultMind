[project]
name = "vaultmind"
version = "0.1.0"
description = "Fully local, privacy-first agentic RAG desktop assistant for your own documents."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "lancedb>=0.40.0",
    "ollama>=0.4",
    "pydantic>=2.7",
    "pymupdf4llm>=1.28.2",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
vaultmind = "vaultmind.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultmind"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ollama.*", "lancedb.*", "pyarrow.*", "pymupdf.*", "pymupdf4llm.*", "fitz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ollama'"
markers = [
    "ollama: needs a running Ollama daemon with the configured models pulled",
]
