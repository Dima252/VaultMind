[project]
name = "vaultmind"
version = "0.1.0"
description = "Fully local, privacy-first agentic RAG desktop assistant for your own documents."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "lancedb>=0.40.0",
    "langgraph>=1.2.14",
    "ollama>=0.4",
    "pydantic>=2.7",
    "pymupdf4llm>=1.28.2",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
vaultmind = "vaultmind.cli:app"

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultmind"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "ollama.*", "lancedb.*", "pyarrow.*", "pymupdf.*", "pymupdf4llm.*", "fitz.*",
    # the optional `rerank` extra (not installed in CI)
    "torch.*", "sentence_transformers.*", "transformers.*", "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ollama'"
markers = [
    "ollama: needs real models: a running Ollama daemon with the configured models pulled, plus the rerank extra and the downloaded reranker",
]

# torch for the reranker: CUDA 12.8 wheels (RTX 50 / Blackwell needs cu128+) on Windows and Linux.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
